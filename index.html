<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraction Plus Calculator</title>
  <style>
    :root {
      --bg: #1e293b;
      --calc-body: #d1d5db;
      --lcd-bg: #82b1b8;
      --lcd-text: #0f2511;
      
      --btn-whole: #94a3b8;
      --btn-num: #cbd5e1;
      --btn-den: #e2e8f0;
      
      --btn-op: #64748b;
      --btn-equals: #f97316;
      --btn-clear: #ef4444;
      --btn-active: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .calculator {
      background: var(--calc-body);
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 3px solid #9ca3af;
    }

    /* Screen */
    .screen {
      background: var(--lcd-bg);
      color: var(--lcd-text);
      font-family: 'Courier New', Courier, monospace;
      border-radius: 8px;
      padding: 12px;
      border: 3px solid #475569;
      margin-bottom: 12px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
    }

    .screen-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: bold;
      opacity: 0.85;
    }

    .screen-main {
      font-size: 2.2rem;
      font-weight: 900;
      text-align: right;
      letter-spacing: 1px;
    }

    .screen-sub {
      font-size: 0.85rem;
      font-weight: bold;
      text-align: right;
      opacity: 0.85;
    }

    /* Keypad Grid Layout */
    .keypad-wrapper {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
      color: #334155;
    }

    /* Column 1: Whole Numbers */
    .whole-column {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: #b0b7c0;
      padding: 8px;
      border-radius: 10px;
    }

    /* Column 2: Stacked Numerator/Denominator */
    .fraction-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #b0b7c0;
      padding: 8px;
      border-radius: 10px;
    }

    .num-grid, .den-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .btn {
      padding: 10px 0;
      font-size: 1.1rem;
      font-weight: bold;
      border: 1px solid #64748b;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 0 #475569;
      color: #0f172a;
      transition: background 0.1s, transform 0.05s;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #475569;
    }

    .btn-whole { background: var(--btn-whole); color: white; }
    .btn-num { background: var(--btn-num); }
    .btn-den { background: var(--btn-den); }
    .btn-clear { background: var(--btn-clear); color: white; grid-column: span 2; }
    .btn-back { background: #cbd5e1; grid-column: span 2; }
    .btn-wide { grid-column: span 2; }

    /* Bottom Operators Row */
    .operators-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .btn-op { background: var(--btn-op); color: white; font-size: 1.3rem; }
    .btn-equals { background: var(--btn-equals); color: white; font-size: 1.4rem; }
    
    /* Config Panel */
    .config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .config-select {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #64748b;
      background: #f8fafc;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .btn-toggle {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #64748b;
      background: #64748b;
      color: white;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-toggle.active {
      background: var(--btn-active);
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Screen -->
    <div class="screen">
      <div class="screen-top">
        <span id="activeFieldTag">FIELD: WHOLE</span>
        <span id="baseTag">BASE: 60</span>
      </div>
      <div id="lcdMain" class="screen-main">0</div>
      <div id="lcdSub" class="screen-sub">Simple: 0</div>
    </div>

    <!-- Controls -->
    <div class="config-row">
      <button id="btnMixToggle" class="btn-toggle active" onclick="toggleMixMode()">Ancient Scale: ON</button>
      <select id="baseSystem" class="config-select" onchange="calculate()">
        <option value="60">Base-60 (Ghatis / Mins)</option>
        <option value="360">Base-360 (Degrees)</option>
        <option value="24">Base-24 (Hours)</option>
        <option value="1">Base-1 (Standard Fraction)</option>
      </select>
    </div>

    <!-- Split Keypad Layout -->
    <div class="keypad-wrapper">
      
      <!-- Whole Number Section (Blue-Gray) -->
      <div>
        <div class="section-label">Whole Number</div>
        <div class="whole-column">
          <button class="btn btn-clear" onclick="clearAll()">C</button>
          
          <button class="btn btn-whole" onclick="appendDigit('w', '1')">1</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '2')">2</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '3')">3</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '4')">4</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '5')">5</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '6')">6</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '7')">7</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '8')">8</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '9')">9</button>
          <button class="btn btn-whole" onclick="appendDigit('w', '0')">0</button>
          
          <button class="btn btn-back" onclick="backspace('w')">⌫ W</button>
        </div>
      </div>

      <!-- Fraction Section (Stacked Light Gray) -->
      <div class="fraction-column">
        <!-- Numerator -->
        <div>
          <div class="section-label">Numerator (Top)</div>
          <div class="num-grid">
            <button class="btn btn-num" onclick="appendDigit('n', '1')">1</button>
            <button class="btn btn-num" onclick="appendDigit('n', '2')">2</button>
            <button class="btn btn-num" onclick="appendDigit('n', '3')">3</button>
            <button class="btn btn-num" onclick="appendDigit('n', '4')">4</button>
            <button class="btn btn-num" onclick="appendDigit('n', '5')">5</button>
            <button class="btn btn-num" onclick="appendDigit('n', '6')">6</button>
            <button class="btn btn-num" onclick="appendDigit('n', '7')">7</button>
            <button class="btn btn-num" onclick="appendDigit('n', '8')">8</button>
            <button class="btn btn-num" onclick="appendDigit('n', '9')">9</button>
            <button class="btn btn-num btn-wide" onclick="appendDigit('n', '0')">0</button>
            <button class="btn btn-num" onclick="backspace('n')">⌫</button>
          </div>
        </div>

        <hr style="border: 1px solid #64748b;">

        <!-- Denominator -->
        <div>
          <div class="section-label">Denominator (Bottom)</div>
          <div class="den-grid">
            <button class="btn btn-den" onclick="appendDigit('d', '1')">1</button>
            <button class="btn btn-den" onclick="appendDigit('d', '2')">2</button>
            <button class="btn btn-den" onclick="appendDigit('d', '3')">3</button>
            <button class="btn btn-den" onclick="appendDigit('d', '4')">4</button>
            <button class="btn btn-den" onclick="appendDigit('d', '5')">5</button>
            <button class="btn btn-den" onclick="appendDigit('d', '6')">6</button>
            <button class="btn btn-den" onclick="appendDigit('d', '7')">7</button>
            <button class="btn btn-den" onclick="appendDigit('d', '8')">8</button>
            <button class="btn btn-den" onclick="appendDigit('d', '9')">9</button>
            <button class="btn btn-den btn-wide" onclick="appendDigit('d', '0')">0</button>
            <button class="btn btn-den" onclick="backspace('d')">⌫</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Operators -->
    <div class="operators-row">
      <button class="btn btn-op" onclick="setOperator('+')">+</button>
      <button class="btn btn-op" onclick="setOperator('-')">−</button>
      <button class="btn btn-op" onclick="setOperator('×')">×</button>
      <button class="btn btn-op" onclick="setOperator('÷')">÷</button>
      <button class="btn btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let activeFrac = 1; // 1 or 2
    let currentOp = '';
    let useAncientScale = true;

    let f1 = { w: '', n: '12', d: '35' };
    let f2 = { w: '', n: '', d: '' };

    function gcd(a, b) {
      return b === 0 ? Math.abs(a) : gcd(b, a % b);
    }

    function toggleMixMode() {
      useAncientScale = !useAncientScale;
      document.getElementById('btnMixToggle').classList.toggle('active', useAncientScale);
      document.getElementById('btnMixToggle').innerText = useAncientScale ? "Ancient Scale: ON" : "Ancient Scale: OFF";
      calculate();
    }

    function appendDigit(type, digit) {
      let target = activeFrac === 1 ? f1 : f2;
      target[type] += digit;
      
      document.getElementById('activeFieldTag').innerText = `EDITING: F${activeFrac} (${type.toUpperCase()})`;
      calculate();
    }

    function backspace(type) {
      let target = activeFrac === 1 ? f1 : f2;
      target[type] = target[type].slice(0, -1);
      calculate();
    }

    function clearAll() {
      f1 = { w: '', n: '', d: '' };
      f2 = { w: '', n: '', d: '' };
      activeFrac = 1;
      currentOp = '';
      document.getElementById('activeFieldTag').innerText = "FIELD: WHOLE";
      document.getElementById('lcdMain').innerText = '0';
      document.getElementById('lcdSub').innerText = 'Simple: 0';
    }

    function setOperator(op) {
      currentOp = op;
      activeFrac = 2;
      document.getElementById('activeFieldTag').innerText = `OPERATOR: ${op} (ENTER F2)`;
    }

    function calculate() {
      const base = parseInt(document.getElementById('baseSystem').value) || 60;
      document.getElementById('baseTag').innerText = `BASE: ${base}`;

      const w1 = parseInt(f1.w) || 0;
      const n1 = parseInt(f1.n) || 0;
      const d1 = parseInt(f1.d) || 1;

      if (d1 === 0) {
        document.getElementById('lcdMain').innerText = "Error";
        document.getElementById('lcdSub').innerText = "Denominator cannot be 0";
        return;
      }

      let totalNum = w1 * d1 + n1;
      let totalDen = d1;

      // Handle binary operation if F2 is provided
      if (currentOp && (f2.n || f2.w)) {
        const w2 = parseInt(f2.w) || 0;
        const n2 = parseInt(f2.n) || 0;
        const d2 = parseInt(f2.d) || 1;

        if (d2 === 0) {
          document.getElementById('lcdMain').innerText = "Error";
          return;
        }

        const num2 = w2 * d2 + n2;

        if (currentOp === '+') { totalNum = totalNum * d2 + num2 * totalDen; totalDen = totalDen * d2; }
        if (currentOp === '-') { totalNum = totalNum * d2 - num2 * totalDen; totalDen = totalDen * d2; }
        if (currentOp === '×') { totalNum = totalNum * num2; totalDen = totalDen * d2; }
        if (currentOp === '÷') { totalNum = totalNum * d2; totalDen = totalDen * num2; }
      }

      // Simplify basic fraction
      const common = gcd(totalNum, totalDen);
      let simpNum = totalNum / common;
      let simpDen = totalDen / common;

      let mainOutput = "";
      let subOutput = `Simple Fraction: ${simpNum}/${simpDen}`;

      // Mixed Fraction Calculation
      if (simpNum >= simpDen) {
        // Standard Mixed Fraction (Top bigger than bottom)
        const whole = Math.floor(simpNum / simpDen);
        const rem = simpNum % simpDen;
        mainOutput = rem === 0 ? `${whole}` : `${whole} ${rem}/${simpDen}`;
      } else if (useAncientScale && base > 1) {
        // Ancient Sub-Unit Scaling for Proper Fractions (e.g., 12/35)
        const scaledTotal = simpNum * base;
        const wholeSub = Math.floor(scaledTotal / simpDen);
        const remSub = scaledTotal % simpDen;
        const subCommon = gcd(remSub, simpDen);

        const label = base === 60 ? "Ghatis/Mins" : base === 360 ? "°" : "Hrs";
        
        if (remSub === 0) {
          mainOutput = `${wholeSub} ${label}`;
        } else {
          mainOutput = `${wholeSub} ${remSub/subCommon}/${simpDen/subCommon} ${label}`;
        }
        subOutput = `Exact: ${simpNum}/${simpDen} (Base-${base} Mixed)`;
      } else {
        mainOutput = `${simpNum}/${simpDen}`;
      }

      document.getElementById('lcdMain').innerText = mainOutput;
      document.getElementById('lcdSub').innerText = subOutput;
    }

    // Initial calculation on load
    calculate();
  </script>
</body>
</html>
