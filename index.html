<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Fraction Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --lcd-bg: #8ba888;
      --lcd-text: #0f2511;
      --btn-calc: #22c55e;
      --btn-clear: #ef4444;
      --input-bg: #0f172a;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .calculator {
      background: var(--card);
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 2px solid #475569;
    }

    /* Result Display */
    .screen {
      background: var(--lcd-bg);
      color: var(--lcd-text);
      font-family: 'Courier New', Courier, monospace;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      border: 3px solid #5b7058;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .screen-label {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 4px;
      opacity: 0.8;
      text-transform: uppercase;
    }

    .screen-main {
      font-size: 2.2rem;
      font-weight: 900;
      min-height: 48px;
      word-break: break-all;
    }

    .screen-sub {
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 4px;
      min-height: 18px;
    }

    /* Expression Builder Inputs */
    .equation-builder {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
    }

    .fraction-input {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .whole-input {
      width: 45px;
      padding: 10px 4px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: var(--input-bg);
      color: var(--text-light);
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }

    .stacked-fraction {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 50px;
    }

    .stacked-fraction input {
      width: 100%;
      padding: 6px 2px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: var(--input-bg);
      color: var(--text-light);
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
    }

    .stacked-fraction hr {
      border: 1px solid #94a3b8;
    }

    select.operator {
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Actions */
    .action-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f172a;
      transition: transform 0.05s ease;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0f172a;
    }

    .btn-clear { background: var(--btn-clear); color: #ffffff; }
    .btn-calc { background: var(--btn-calc); color: #0f172a; }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Screen Display -->
    <div class="screen">
      <div class="screen-label">Mixed Fraction Result</div>
      <div id="lcdMain" class="screen-main">0</div>
      <div id="lcdSub" class="screen-sub">Simple: 0</div>
    </div>

    <!-- Fraction Inputs -->
    <div class="equation-builder">
      <!-- First Fraction -->
      <div class="fraction-input">
        <input type="number" id="w1" class="whole-input" placeholder="W" value="">
        <div class="stacked-fraction">
          <input type="number" id="n1" placeholder="N" value="13">
          <hr>
          <input type="number" id="d1" placeholder="D" value="150">
        </div>
      </div>

      <!-- Operator Selector -->
      <select id="op" class="operator" onchange="calculate()">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="×">×</option>
        <option value="÷" selected>÷</option>
      </select>

      <!-- Second Fraction -->
      <div class="fraction-input">
        <input type="number" id="w2" class="whole-input" placeholder="W" value="">
        <div class="stacked-fraction">
          <input type="number" id="n2" placeholder="N" value="1">
          <hr>
          <input type="number" id="d2" placeholder="D" value="1">
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="action-row">
      <button class="btn btn-clear" onclick="clearInputs()">Clear</button>
      <button class="btn btn-calc" onclick="calculate()">Calculate</button>
    </div>
  </div>

  <script>
    function gcd(a, b) {
      return b === 0 ? Math.abs(a) : gcd(b, a % b);
    }

    function clearInputs() {
      document.getElementById('w1').value = '';
      document.getElementById('n1').value = '';
      document.getElementById('d1').value = '';
      document.getElementById('w2').value = '';
      document.getElementById('n2').value = '';
      document.getElementById('d2').value = '';
      document.getElementById('lcdMain').innerText = '0';
      document.getElementById('lcdSub').innerText = 'Simple: 0';
    }

    function getImproperNumerator(whole, num, den) {
      const w = parseInt(whole) || 0;
      const n = parseInt(num) || 0;
      const d = parseInt(den) || 1;
      
      return (w < 0) ? (w * d - n) : (w * d + n);
    }

    function calculate() {
      const w1 = document.getElementById('w1').value;
      const n1 = document.getElementById('n1').value;
      const d1 = document.getElementById('d1').value || 1;

      const w2 = document.getElementById('w2').value;
      const n2 = document.getElementById('n2').value;
      const d2 = document.getElementById('d2').value || 1;

      const op = document.getElementById('op').value;

      const den1 = parseInt(d1) || 1;
      const den2 = parseInt(d2) || 1;

      if (den1 === 0 || den2 === 0) {
        document.getElementById('lcdMain').innerText = "Error";
        document.getElementById('lcdSub').innerText = "Denominator cannot be 0";
        return;
      }

      const num1 = getImproperNumerator(w1, n1, den1);
      const num2 = getImproperNumerator(w2, n2, den2);

      let resNum = 0;
      let resDen = 1;

      if (op === '+') {
        resNum = num1 * den2 + num2 * den1;
        resDen = den1 * den2;
      } else if (op === '-') {
        resNum = num1 * den2 - num2 * den1;
        resDen = den1 * den2;
      } else if (op === '×') {
        resNum = num1 * num2;
        resDen = den1 * den2;
      } else if (op === '÷') {
        if (num2 === 0) {
          document.getElementById('lcdMain').innerText = "Error";
          document.getElementById('lcdSub').innerText = "Cannot divide by 0";
          return;
        }
        resNum = num1 * den2;
        resDen = den1 * num2;
      }

      // Simplify result
      const common = gcd(resNum, resDen);
      let simpNum = resNum / common;
      let simpDen = resDen / common;

      if (simpDen < 0) {
        simpNum = -simpNum;
        simpDen = -simpDen;
      }

      // Convert to Mixed Fraction
      let mainDisplay = "";
      if (Math.abs(simpNum) >= simpDen && simpDen !== 1) {
        const wholePart = Math.trunc(simpNum / simpDen);
        const remNum = Math.abs(simpNum) % simpDen;
        mainDisplay = `${wholePart} ${remNum}/${simpDen}`;
      } else {
        mainDisplay = simpDen === 1 ? `${simpNum}` : `${simpNum}/${simpDen}`;
      }

      document.getElementById('lcdMain').innerText = mainDisplay;
      document.getElementById('lcdSub').innerText = simpDen === 1 ? "Whole Number" : `Simple: ${simpNum}/${simpDen}`;
    }

    // Run initial calculation
    calculate();
  </script>
</body>
</html>
