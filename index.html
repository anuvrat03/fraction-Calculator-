<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ancient Mixed Fraction Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --lcd-bg: #8ba888;
      --lcd-text: #0f2511;
      --btn-clear: #ef4444;
      --input-bg: #0f172a;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .calculator {
      background: var(--card);
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 2px solid #475569;
    }

    /* Screen Display */
    .screen {
      background: var(--lcd-bg);
      color: var(--lcd-text);
      font-family: 'Courier New', Courier, monospace;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      border: 3px solid #5b7058;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .screen-label {
      font-size: 0.7rem;
      font-weight: bold;
      margin-bottom: 4px;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .screen-main {
      font-size: 2.2rem;
      font-weight: 900;
      min-height: 48px;
      word-break: break-all;
    }

    .screen-sub {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 6px;
      color: #1a3a1d;
    }

    /* Equation Builder */
    .equation-builder {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
    }

    .fraction-input {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .whole-input {
      width: 48px;
      padding: 12px 4px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: var(--input-bg);
      color: var(--text-light);
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
    }

    .stacked-fraction {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 52px;
    }

    .stacked-fraction input {
      width: 100%;
      padding: 6px 2px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: var(--input-bg);
      color: var(--text-light);
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }

    .stacked-fraction hr {
      border: 1px solid #94a3b8;
    }

    select.operator {
      padding: 10px 4px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-clear {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: var(--btn-clear);
      color: #ffffff;
      box-shadow: 0 4px 0 #0f172a;
    }

    .btn-clear:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0f172a;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Screen Display -->
    <div class="screen">
      <div class="screen-label">Mixed Fraction Result</div>
      <div id="lcdMain" class="screen-main">1 1/3</div>
      <div id="lcdSub" class="screen-sub">Simple Fraction: 4/3</div>
    </div>

    <!-- Inputs -->
    <div class="equation-builder">
      <!-- Fraction 1 -->
      <div class="fraction-input">
        <input type="number" id="w1" class="whole-input" placeholder="W" value="1" min="0" oninput="calculate()">
        <div class="stacked-fraction">
          <input type="number" id="n1" placeholder="N" value="2" min="0" oninput="calculate()">
          <hr>
          <input type="number" id="d1" placeholder="D" value="6" min="1" oninput="calculate()">
        </div>
      </div>

      <!-- Operator -->
      <select id="op" class="operator" onchange="calculate()">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="×">×</option>
        <option value="÷">÷</option>
      </select>

      <!-- Fraction 2 -->
      <div class="fraction-input">
        <input type="number" id="w2" class="whole-input" placeholder="W" value="0" min="0" oninput="calculate()">
        <div class="stacked-fraction">
          <input type="number" id="n2" placeholder="N" value="0" min="0" oninput="calculate()">
          <hr>
          <input type="number" id="d2" placeholder="D" value="1" min="1" oninput="calculate()">
        </div>
      </div>
    </div>

    <button class="btn-clear" onclick="clearInputs()">Clear All</button>
  </div>

  <script>
    function gcd(a, b) {
      return b === 0 ? Math.abs(a) : gcd(b, a % b);
    }

    function clearInputs() {
      document.getElementById('w1').value = '';
      document.getElementById('n1').value = '';
      document.getElementById('d1').value = '';
      document.getElementById('w2').value = '';
      document.getElementById('n2').value = '';
      document.getElementById('d2').value = '';
      calculate();
    }

    function calculate() {
      const w1 = parseInt(document.getElementById('w1').value) || 0;
      const n1 = parseInt(document.getElementById('n1').value) || 0;
      const d1 = parseInt(document.getElementById('d1').value) || 1;

      const w2 = parseInt(document.getElementById('w2').value) || 0;
      const n2 = parseInt(document.getElementById('n2').value) || 0;
      const d2 = parseInt(document.getElementById('d2').value) || 1;

      const op = document.getElementById('op').value;

      if (d1 === 0 || d2 === 0) {
        document.getElementById('lcdMain').innerText = "Error";
        document.getElementById('lcdSub').innerText = "Denominator cannot be 0";
        return;
      }

      // Convert whole + fraction into improper numerator
      const num1 = w1 * d1 + n1;
      const num2 = w2 * d2 + n2;

      let resNum = 0;
      let resDen = 1;

      if (op === '+') {
        resNum = num1 * d2 + num2 * d1;
        resDen = d1 * d2;
      } else if (op === '-') {
        resNum = num1 * d2 - num2 * d1;
        resDen = d1 * d2;
      } else if (op === '×') {
        resNum = num1 * num2;
        resDen = d1 * d2;
      } else if (op === '÷') {
        if (num2 === 0) {
          document.getElementById('lcdMain').innerText = "Error";
          document.getElementById('lcdSub').innerText = "Cannot divide by 0";
          return;
        }
        resNum = num1 * d2;
        resDen = d1 * num2;
      }

      // Simplify using GCD
      const common = gcd(resNum, resDen);
      let simpNum = resNum / common;
      let simpDen = resDen / common;

      // Build display outputs
      let mixedDisplay = "";
      if (Math.abs(simpNum) >= simpDen && simpDen !== 1) {
        const wholePart = Math.trunc(simpNum / simpDen);
        const remNum = Math.abs(simpNum) % simpDen;
        mixedDisplay = remNum === 0 ? `${wholePart}` : `${wholePart} ${remNum}/${simpDen}`;
      } else {
        mixedDisplay = simpDen === 1 ? `${simpNum}` : `${simpNum}/${simpDen}`;
      }

      const simpleDisplay = simpDen === 1 ? `${simpNum}` : `${simpNum}/${simpDen}`;

      document.getElementById('lcdMain').innerText = mixedDisplay;
      document.getElementById('lcdSub').innerText = `Simple Fraction: ${simpleDisplay}`;
    }

    calculate();
  </script>
</body>
</html>
