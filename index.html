<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraction Calculator - Vertical Mixed Fraction Display</title>
  <style>
    /* Main body background layout */
    body {
      background-color: #121212;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Outer calculator enclosure styling */
    .calculator {
      background: #e6e6e6;
      border-radius: 24px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Teal top display window */
    .display-screen {
      background-color: #63b3c0;
      border-radius: 12px;
      padding: 12px;
      height: 110px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border: 2px solid #4a98a5;
    }

    /* Header title inside display */
    .display-header {
      font-size: 11px;
      font-weight: bold;
      color: #1a3c40;
      letter-spacing: 0.5px;
    }

    /* Top right link button for sharing */
    .share-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #1a3c40;
    }

    /* Content row inside display containing chart and output text */
    .output-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 65px;
    }

    /* Canvas element rendering the pie chart */
    #pieCanvas {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: none; /* Hidden until equals is clicked */
    }

    /* Outer display wrapper for mathematical alignment */
    .text-output {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      color: #000;
      font-weight: bold;
    }

    /* Large whole number typography matching image reference */
    .whole-number {
      font-size: 48px;
      line-height: 1;
      margin-right: 6px;
      font-weight: 900;
    }

    /* Stacked fraction container (Numerator over Denominator) */
    .fraction-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.1;
    }

    /* Horizontal fraction bar */
    .fraction-bar {
      border-top: 2.5px solid #000;
      width: 100%;
      margin: 1px 0;
    }

    /* Standard inline entry text prior to calculation */
    .raw-text {
      font-size: 26px;
      font-weight: bold;
    }

    /* Calculator keypad layout grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    /* Generic keypad button style */
    .btn {
      background: #f0f0e8;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      color: #222;
      cursor: pointer;
      box-shadow: 0 4px #c2c2ba;
      user-select: none;
    }

    .btn:active {
      box-shadow: 0 1px #c2c2ba;
      transform: translateY(3px);
    }

    /* Red clear button */
    .btn-clear {
      background: #fcd0d0;
      color: #a00;
      box-shadow: 0 4px #e0a8a8;
    }

    /* Light blue function buttons */
    .btn-op {
      background: #cbdcfc;
      color: #002b66;
      box-shadow: 0 4px #a3beed;
    }

    /* Orange calculation button */
    .btn-equal {
      background: #f08c00;
      color: #fff;
      box-shadow: 0 4px #b86b00;
    }
  </style>
</head>
<body>

<div class="calculator">
  <!-- Calculator Screen Display -->
  <div class="display-screen">
    <div class="display-header">FRACTION CALCULATOR</div>
    <button class="share-btn" onclick="shareResult()" title="Share Result">🔗</button>
    
    <div class="output-container">
      <!-- Dynamic Visual Pie Chart Canvas -->
      <canvas id="pieCanvas" width="55" height="55"></canvas>
      <!-- Mathematical Output Display Container -->
      <div class="text-output" id="display"><span class="raw-text">0</span></div>
    </div>
  </div>

  <!-- Keypad Buttons -->
  <div class="keypad">
    <button class="btn" onclick="press('7')">7</button>
    <button class="btn" onclick="press('8')">8</button>
    <button class="btn" onclick="press('9')">9</button>

    <button class="btn" onclick="press('4')">4</button>
    <button class="btn" onclick="press('5')">5</button>
    <button class="btn" onclick="press('6')">6</button>

    <button class="btn" onclick="press('1')">1</button>
    <button class="btn" onclick="press('2')">2</button>
    <button class="btn" onclick="press('3')">3</button>

    <button class="btn btn-clear" onclick="clearDisplay()">C</button>
    <button class="btn" onclick="press('0')">0</button>
    <button class="btn btn-op" onclick="backspace()">⌫</button>

    <button class="btn btn-op" onclick="press('.')">.</button>
    <button class="btn btn-op" onclick="press('/')">/</button>
    <button class="btn btn-equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  // Variables tracking user input and share text
  let currentInput = "";
  let shareableText = "";

  // Append key stroke to typing input
  function press(key) {
    currentInput += key;
    document.getElementById("display").innerHTML = `<span class="raw-text">${currentInput}</span>`;
  }

  // Clear screen state and reset canvas
  function clearDisplay() {
    currentInput = "";
    shareableText = "0";
    document.getElementById("display").innerHTML = `<span class="raw-text">0</span>`;
    document.getElementById("pieCanvas").style.display = "none";
  }

  // Delete last entered character
  function backspace() {
    currentInput = currentInput.slice(0, -1);
    document.getElementById("display").innerHTML = `<span class="raw-text">${currentInput || '0'}</span>`;
  }

  // Primary calculation logic
  function calculate() {
    try {
      if (!currentInput) return;

      let num, den;

      // Parse fraction input (e.g., 44/12 or 36/11)
      if (currentInput.includes("/")) {
        let parts = currentInput.split("/");
        if (parts.length === 2) {
          num = parseInt(parts[0]);
          den = parseInt(parts[1]);
        } else {
          showError("Error");
          return;
        }
      } else {
        // Plain integer entry
        num = parseInt(currentInput);
        den = 1;
      }

      if (isNaN(num) || isNaN(den) || den === 0) {
        showError("Error");
        return;
      }

      // Render vertical fraction visual layout
      renderMixedFractionDisplay(num, den);

      // Render pie chart with high-contrast borders
      renderPieChart(num, den);

    } catch (e) {
      showError("Error");
    }
  }

  // Show inline error text
  function showError(msg) {
    document.getElementById("display").innerHTML = `<span class="raw-text">${msg}</span>`;
    document.getElementById("pieCanvas").style.display = "none";
  }

  // Formats output with a huge whole number and vertically stacked fraction
  function renderMixedFractionDisplay(numerator, denominator) {
    let absNum = Math.abs(numerator);
    let absDen = Math.abs(denominator);

    let wholeNumber = Math.floor(absNum / absDen);
    let remainder = absNum % absDen;
    let sign = numerator < 0 ? "-" : "";

    let displayHTML = "";

    if (remainder === 0) {
      // Whole integer result
      displayHTML = `<span class="whole-number">${sign}${wholeNumber}</span>`;
      shareableText = `${sign}${wholeNumber}`;
    } else if (wholeNumber > 0) {
      // Mixed fraction (Large whole number + Stacked fraction)
      displayHTML = `
        <span class="whole-number">${sign}${wholeNumber}</span>
        <div class="fraction-stack">
          <div>${remainder}</div>
          <div class="fraction-bar"></div>
          <div>${absDen}</div>
        </div>
      `;
      shareableText = `${sign}${wholeNumber} ${remainder}/${absDen}`;
    } else {
      // Pure proper fraction (Stacked only)
      displayHTML = `
        <span class="whole-number">${sign}</span>
        <div class="fraction-stack">
          <div>${remainder}</div>
          <div class="fraction-bar"></div>
          <div>${absDen}</div>
        </div>
      `;
      shareableText = `${sign}${remainder}/${absDen}`;
    }

    document.getElementById("display").innerHTML = displayHTML;
  }

  // Renders segmented pie chart with dark outlines around every slice
  function renderPieChart(numerator, denominator) {
    let canvas = document.getElementById("pieCanvas");
    let ctx = canvas.getContext("2d");
    canvas.style.display = "block";

    let width = canvas.width;
    let height = canvas.height;
    let radius = width / 2;

    // Clear previous drawing
    ctx.clearRect(0, 0, width, height);

    // Calculate remainder portion for the visual slice
    let remainder = Math.abs(numerator) % denominator;
    let filledSlices = remainder === 0 ? denominator : remainder;

    // Draw slices according to denominator division
    for (let i = 0; i < denominator; i++) {
      let startAngle = (i / denominator) * 2 * Math.PI - (Math.PI / 2);
      let endAngle = ((i + 1) / denominator) * 2 * Math.PI - (Math.PI / 2);

      ctx.beginPath();
      ctx.moveTo(radius, radius);
      ctx.arc(radius, radius, radius, startAngle, endAngle);
      ctx.closePath();

      // Yellow for active numerator slices, Deep Navy for base background
      if (i < filledSlices) {
        ctx.fillStyle = "#ffb703"; // Vivid yellow slice
      } else {
        ctx.fillStyle = "#1d3557"; // Deep navy blue base
      }
      ctx.fill();

      // Dark Blue / Black high-contrast borders between slices
      ctx.strokeStyle = "#0b132b";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // Native Web Share API function
  async function shareResult() {
    let canvas = document.getElementById("pieCanvas");
    let textToShare = `Fraction Result: ${shareableText || '0'}`;

    if (navigator.share) {
      try {
        if (canvas.style.display !== "none") {
          canvas.toBlob(async (blob) => {
            let file = new File([blob], "fraction_chart.png", { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'Fraction Calculator Result',
                text: textToShare,
                files: [file]
              });
            } else {
              await navigator.share({ title: 'Fraction Calculator Result', text: textToShare });
            }
          });
        } else {
          await navigator.share({ title: 'Fraction Calculator Result', text: textToShare });
        }
      } catch (err) {
        console.log("Sharing cancelled or unsupported");
      }
    } else {
      alert(`Sharing Result:\n${textToShare}`);
    }
  }
</script>

</body>
</html>
