<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraction Calculator with Visual Pie Chart</title>
  <style>
    /* Global page styling to center the app on screen */
    body {
      background-color: #121212;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Calculator container styled like a handheld device */
    .calculator {
      background: #e6e6e6;
      border-radius: 24px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Display area matching the teal color scheme */
    .display-screen {
      background-color: #63b3c0;
      border-radius: 12px;
      padding: 12px;
      height: 110px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border: 2px solid #4a98a5;
    }

    /* Title text inside top-left display */
    .display-header {
      font-size: 11px;
      font-weight: bold;
      color: #1a3c40;
      letter-spacing: 0.5px;
    }

    /* Share button positioned at top-right display */
    .share-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #1a3c40;
    }

    /* Container holding the pie chart and output text */
    .output-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 65px;
    }

    /* Canvas element for rendering high-contrast pie chart */
    #pieCanvas {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: none; /* Hidden until user presses equals */
    }

    /* Calculated output text displaying fractions/values */
    .text-output {
      font-size: 26px;
      font-weight: bold;
      color: #000;
      text-align: right;
      width: 100%;
      word-break: break-all;
    }

    /* Grid layout for standard calculator keys */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    /* Standard button styling */
    .btn {
      background: #f0f0e8;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      color: #222;
      cursor: pointer;
      box-shadow: 0 4px #c2c2ba;
      user-select: none;
    }

    .btn:active {
      box-shadow: 0 1px #c2c2ba;
      transform: translateY(3px);
    }

    /* Clear key button styling */
    .btn-clear {
      background: #fcd0d0;
      color: #a00;
      box-shadow: 0 4px #e0a8a8;
    }

    /* Operator key button styling */
    .btn-op {
      background: #cbdcfc;
      color: #002b66;
      box-shadow: 0 4px #a3beed;
    }

    /* Equals key button styling */
    .btn-equal {
      background: #f08c00;
      color: #fff;
      box-shadow: 0 4px #b86b00;
    }
  </style>
</head>
<body>

<div class="calculator">
  <!-- Calculator Screen Display -->
  <div class="display-screen">
    <div class="display-header">FRACTION CALCULATOR</div>
    <button class="share-btn" onclick="shareResult()" title="Share Result">🔗</button>
    
    <div class="output-container">
      <!-- High Contrast Pie Chart Canvas -->
      <canvas id="pieCanvas" width="55" height="55"></canvas>
      <!-- Fractional Value Output Text -->
      <div class="text-output" id="display">0</div>
    </div>
  </div>

  <!-- Calculator Keypad Layout -->
  <div class="keypad">
    <button class="btn" onclick="press('7')">7</button>
    <button class="btn" onclick="press('8')">8</button>
    <button class="btn" onclick="press('9')">9</button>

    <button class="btn" onclick="press('4')">4</button>
    <button class="btn" onclick="press('5')">5</button>
    <button class="btn" onclick="press('6')">6</button>

    <button class="btn" onclick="press('1')">1</button>
    <button class="btn" onclick="press('2')">2</button>
    <button class="btn" onclick="press('3')">3</button>

    <button class="btn btn-clear" onclick="clearDisplay()">C</button>
    <button class="btn" onclick="press('0')">0</button>
    <button class="btn btn-op" onclick="backspace()">⌫</button>

    <button class="btn btn-op" onclick="press('.')">.</button>
    <button class="btn btn-op" onclick="press('/')">/</button>
    <button class="btn btn-equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  // Variables to hold input sequence and last result text
  let currentInput = "";
  let lastResultText = "";

  // Append clicked digit or operator to input sequence
  function press(key) {
    currentInput += key;
    document.getElementById("display").innerText = currentInput;
  }

  // Clear display screen and reset calculator state
  function clearDisplay() {
    currentInput = "";
    lastResultText = "0";
    document.getElementById("display").innerText = "0";
    document.getElementById("pieCanvas").style.display = "none";
  }

  // Remove the last entered character from display
  function backspace() {
    currentInput = currentInput.slice(0, -1);
    document.getElementById("display").innerText = currentInput || "0";
  }

  // Process input expression, convert result to fraction, and render pie chart
  function calculate() {
    try {
      if (!currentInput) return;

      // Safe mathematical evaluation of typed string
      let evaluatedValue = eval(currentInput);

      if (isNaN(evaluatedValue) || !isFinite(evaluatedValue)) {
        document.getElementById("display").innerText = "Error";
        return;
      }

      // Format decimal output into fraction text
      let fractionText = decimalToFraction(evaluatedValue);
      lastResultText = fractionText;
      document.getElementById("display").innerText = fractionText;

      // Render chart with high-contrast blue circle and yellow slice
      renderPieChart(evaluatedValue);

    } catch (e) {
      document.getElementById("display").innerText = "Error";
    }
  }

  // Helper function converting decimal values into proper/mixed fractions
  function decimalToFraction(val) {
    if (Number.isInteger(val)) return val.toString();

    let wholePart = Math.floor(Math.abs(val));
    let decimalPart = Math.abs(val) - wholePart;

    // Greatest common divisor helper
    const gcd = (a, b) => b ? gcd(b, a % b) : a;

    let precision = 10000;
    let num = Math.round(decimalPart * precision);
    let den = precision;
    let common = gcd(num, den);

    num = num / common;
    den = den / common;

    let sign = val < 0 ? "-" : "";
    if (wholePart === 0) {
      return `${sign}${num}/${den}`;
    } else {
      return `${sign}${wholePart} ${num}/${den}`;
    }
  }

  // Draws high-contrast dynamic pie chart (Deep Blue Circle + Bright Yellow Slice)
  function renderPieChart(value) {
    let canvas = document.getElementById("pieCanvas");
    let ctx = canvas.getContext("2d");
    canvas.style.display = "block";

    let width = canvas.width;
    let height = canvas.height;
    let radius = width / 2;

    // Clear previous drawing frame
    ctx.clearRect(0, 0, width, height);

    // Compute fractional angle percentage
    let fractionRemainder = Math.abs(value) % 1;
    if (fractionRemainder === 0) fractionRemainder = 1; // Full circle for integers

    let sliceAngle = fractionRemainder * 2 * Math.PI;

    // Step 1: Draw high-contrast deep blue circle background
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
    ctx.fillStyle = "#1d3557"; // Deep royal blue circle base
    ctx.fill();

    // Step 2: Draw vibrant bright yellow slice for fraction visual
    ctx.beginPath();
    ctx.moveTo(radius, radius);
    ctx.arc(radius, radius, radius, -Math.PI / 2, -Math.PI / 2 + sliceAngle);
    ctx.closePath();
    ctx.fillStyle = "#ffb703"; // Bright vivid yellow pie slice
    ctx.fill();
  }

  // Web Share API to share image canvas and fraction text
  async function shareResult() {
    let canvas = document.getElementById("pieCanvas");
    let textToShare = `Fraction Result: ${lastResultText || '0'}`;

    if (navigator.share) {
      try {
        if (canvas.style.display !== "none") {
          // Export canvas pie chart to PNG image file for sharing
          canvas.toBlob(async (blob) => {
            let file = new File([blob], "fraction_chart.png", { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'Fraction Calculator Result',
                text: textToShare,
                files: [file]
              });
            } else {
              await navigator.share({ title: 'Fraction Calculator Result', text: textToShare });
            }
          });
        } else {
          await navigator.share({ title: 'Fraction Calculator Result', text: textToShare });
        }
      } catch (err) {
        console.log("Sharing cancelled or unsupported");
      }
    } else {
      alert(`Sharing Result:\n${textToShare}`);
    }
  }
</script>

</body>
</html>
